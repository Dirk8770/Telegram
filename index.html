<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für die korrekte Skalierung auf dem Smartphone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Home Control</title>
    
    <!-- Die offizielle Telegram Web App Bibliothek -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Farben werden automatisch vom Telegram-Theme des Nutzers übernommen */
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        
        h2 {
            margin-bottom: 20px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h2>Zentrale Steuerung</h2>

    <div class="btn-group">
        <!-- Beim Klick wird die Funktion sendCommand mit dem jeweiligen Wert aufgerufen -->
        <button onclick="sendCommand('SKIMMER_ON')">Skimmer einschalten (60W)</button>
        <button onclick="sendCommand('TANK_STATUS')">Smart Tank Manager abfragen</button>
        <button onclick="sendCommand('ALARM_OFF')">Wasser-Alarm zurücksetzen</button>
    </div>

    <script>
        // Initialisiere die Telegram Web App
        const tg = window.Telegram.WebApp;

        // App im Vollbildmodus öffnen, statt nur im halben Fenster
        tg.expand();

        // Dem Bot signalisieren, dass die App bereit ist
        tg.ready();

        // Funktion zum Senden der Daten an den ioBroker / Bot
        function sendCommand(command) {
            // sendData schickt einen versteckten String an den Bot und schließt die Mini App
            tg.sendData(command);
        }
    </script>

</body>
</html>
