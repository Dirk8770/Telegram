<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Home Dashboard</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            margin: 0;
        }
        
        h2 {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 24px;
            color: var(--tg-theme-hint-color, #888888);
        }

        /* Standardmäßig sind alle Seiten ausgeblendet */
        .page {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        /* Nur die aktive Seite wird als Flexbox angezeigt */
        .page.active {
            display: flex;
        }

        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: #ff3b30;
            color: white;
        }
        
        /* Spezielles Styling für Status-Buttons */
        .btn-info {
            background-color: var(--tg-theme-secondary-bg-color, #e5e5ea);
            color: var(--tg-theme-text-color, #000000);
        }
    </style>
</head>
<body>

    <h2>Zentrale Steuerung</h2>

    <!-- HAUPTMENÜ -->
    <div id="main-menu" class="page active">
        <!-- sendCommand schließt die App direkt, showPage wechselt das Menü -->
        <button onclick="sendCommand('/command0')">ℹ️ Hilfe</button>
        <button onclick="showPage('menu-heizung')">🌡️ Heizungssteuerung</button>
        <button onclick="sendCommand('/command2')">📊 Status</button>
        <button onclick="sendCommand('/command3')">🤖 KI Steuerung</button>
        <button onclick="showPage('menu-teich')">🐟 Teich</button>
        <button onclick="showPage('menu-geraete')">🔌 Gerätesteuerung</button>
        <button onclick="sendCommand('/command7')">📅 Veranstaltungen</button>
        <button onclick="sendCommand('/command8')">⛽ Tankstelle</button>
        <button onclick="sendCommand('/command9')">⚡ Flex Strom Analyzer</button>
        <button class="btn-danger" onclick="sendCommand('/command10')">⚠️ SmartHome Neustart</button>
        <button onclick="sendCommand('/command11')">🛒 Einkaufsliste</button>
    </div>

    <!-- UNTERMENÜ: HEIZUNG -->
    <div id="menu-heizung" class="page">
        <button onclick="sendCommand('/heizung_auto')">🌡️ Automatikmodus</button>
        <button onclick="sendCommand('/heizung_urlaub')">✈️ Urlaubsmodus</button>
        <button onclick="sendCommand('/heizung_boost')">🔥 Boost</button>
    </div>

    <!-- UNTERMENÜ: TEICH -->
    <div id="menu-teich" class="page">
        <button onclick="sendCommand('/skimmer_on')">🌊 Skimmer (60W) Ein</button>
        <button class="btn-info" onclick="sendCommand('/skimmer_off')">🌊 Skimmer Aus</button>
        <button onclick="sendCommand('/pumpe_on')">💧 Filterpumpe Ein</button>
        <button class="btn-info" onclick="sendCommand('/pumpe_off')">💧 Filterpumpe Aus</button>
    </div>

    <!-- UNTERMENÜ: GERÄTESTEUERUNG -->
    <div id="menu-geraete" class="page">
        <button onclick="sendCommand('/waschmaschine_start')">🧺 Waschmaschine Starten</button>
        <button class="btn-info" onclick="sendCommand('/waschmaschine_status')">🧺 Status Waschmaschine</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        tg.expand();
        tg.ready();

        // Funktion zum Wechseln der Seiten
        function showPage(pageId) {
            // Alle Seiten verstecken
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Gewünschte Seite anzeigen
            document.getElementById(pageId).classList.add('active');

            // Telegram "Zurück"-Button in der Kopfzeile einblenden, wenn wir nicht im Hauptmenü sind
            if (pageId === 'main-menu') {
                tg.BackButton.hide();
            } else {
                tg.BackButton.show();
            }
        }

        // Was passiert, wenn man oben links auf den Telegram-Pfeil "Zurück" drückt?
        tg.BackButton.onClick(() => {
            showPage('main-menu');
        });

        // Funktion zum Senden des finalen Befehls
        function sendCommand(cmd) {
            tg.sendData(cmd);
        }
    </script>

</body>
</html>
