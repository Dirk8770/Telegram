<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Home Dashboard</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            margin: 0;
        }
        
        h2 {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 24px;
            color: var(--tg-theme-hint-color, #888888);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* Spezielle Warn-Farbe für den Neustart */
        .btn-danger {
            background-color: #ff3b30;
            color: white;
        }
    </style>
</head>
<body>

    <h2>Zentrale Steuerung</h2>

    <div class="btn-group">
        <button onclick="sendCommand('command0')">ℹ️ Hilfe</button>
        <button onclick="sendCommand('command1')">🌡️ Heizungssteuerung</button>
        <button onclick="sendCommand('command2')">📊 Status</button>
        <button onclick="sendCommand('command3')">🤖 KI Steuerung</button>
        <button onclick="sendCommand('command4')">🐟 Teich</button>
        <button onclick="sendCommand('command5')">🔌 Gerätesteuerung</button>
        <button onclick="sendCommand('command7')">📅 Veranstaltungen</button>
        <button onclick="sendCommand('command8')">⛽ Tankstelle</button>
        <button onclick="sendCommand('command9')">⚡ Flex Strom Analyzer</button>
        <button class="btn-danger" onclick="sendCommand('command10')">⚠️ SmartHome Neustart</button>
        <button onclick="sendCommand('command11')">🛒 Einkaufsliste</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        tg.expand();
        tg.ready();

        function sendCommand(cmd) {
            tg.sendData(cmd);
        }
    </script>

</body>
</html>
